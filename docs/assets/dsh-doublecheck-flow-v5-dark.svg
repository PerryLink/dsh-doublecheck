<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">dsh-doublecheck delivery gate — four phases, two kinds of evidence, one verdict</title>
<desc id="fig-desc">The durable session log feeds four phase rows: requirements and tests fold deterministically with no model call, consistency and review each fork one read-only reviewer. Only a failing check crosses into the verdict rail; warnings and skips never flip the verdict. The footer carries gate-report.md, gate-report.json, the CI exit code and the bounded one-line projection.</desc>
