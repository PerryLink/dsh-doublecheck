# v0.3 acceptance overlay: block + all three gates on (whole-row config restated).
- id: doublecheck-guard
  config:
    intensity: block
    modules:
      grill: true
      tdd: true
      adversary: true
    adversaryModel: null
    adversaryProvider: 'fork'
    adversaryMaxFindings: 5
    adversaryTools: ['read', 'glob', 'grep']
    adversaryTimeoutMs: 180000
    guardTools: ['edit', 'write']
    vagueTaskMaxChars: 200
    remindOnce: true
    testToolNames: ['bash', 'pwsh']
    testCommandPatterns:
      - '(?:^|[;&|]\s*)(?:(?:pnpm|npm|npx|yarn|bun)(?:\s+run)?\s+(?:test|vitest|jest|mocha)(?:\s|$))'
      - '(?:^|[;&|]\s*)(?:(?:pytest|go\s+test|cargo\s+test|make\s+test|ctest)(?:\s|$))'
      - '(?:^|[;&|]\s*)(?:node\s+--test(?:\s|$))'
    testFilePatterns:
      - '(^|[\\/])(tests?|__tests__|specs?)([\\/]|$)'
      - '\\.(test|spec)\\.[A-Za-z0-9]+$'
