name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # The packageManager field in package.json pins the exact pnpm version.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # No registry-url on purpose: it writes
          # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} into .npmrc, and with
          # the secret retired that line is an empty bearer token - the registry
          # answers 404 on PUT instead of letting npm do the OIDC exchange.

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # npm publish runs prepublishOnly (tsc + full test suite) automatically.
      # Trusted publishing: the OIDC token (id-token: write above) replaces the
      # long-lived NPM_TOKEN, so this step reads no secret. The empty-token guard
      # is gone on purpose - with the secret retired it would fail every release.
      - name: Upgrade npm and show what the publish will authenticate with
        run: |
          npm install -g npm@^11.5.1
          echo "npm: $(npm --version)"
          echo "registry: $(npm config get registry)"
          if [ -f .npmrc ]; then echo "--- workspace .npmrc ---"; cat .npmrc; else echo "no workspace .npmrc"; fi
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then echo "OIDC request TOKEN: present"; else echo "OIDC request TOKEN: MISSING"; fi

      - name: Publish
        env:
          # npm's OIDC exchange never throws: a failure is only visible at verbose
          # level, otherwise the step just fails with ENEEDAUTH and no reason.
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-doublecheck@${version}" version >/dev/null 2>&1; then
            echo "dsh-doublecheck@${version} is already published; skipping npm publish"
          else
            # See the guard above: npm's read side can lag a successful publish, so a re-pushed
            # tag can miss it and hit E409 ("Cannot publish over previously staged version"). That
            # means the version already exists, so report it as done instead of failing the job.
            set +e
            out="$(npm publish --provenance 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$out"
            if [ "$status" -ne 0 ]; then
              if printf '%s' "$out" | grep -q 'E409'; then
                echo "already on the registry (E409); treating the publish as done"
              else
                exit "$status"
              fi
            fi
          fi

      # Advisory only: npm's read side can lag minutes behind a successful publish, and a hard
      # failure here skipped the GitHub Release (observed on dsh-cert-mcp v0.2.1).
      - name: Verify the version is live on the registry (advisory)
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 12); do
            if npm view "dsh-doublecheck@${version}" version >/dev/null 2>&1; then
              echo "dsh-doublecheck@${version} is live on the registry"
              exit 0
            fi
            echo "attempt ${attempt}: not visible on the registry yet; retrying"
            sleep 15
          done
          echo "::warning::dsh-doublecheck@${version} is still not visible on the registry after ~3 minutes (the publish step reported success; npm's read side is lagging)"

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "release ${{ github.ref_name }} already exists; skipping"
            exit 0
          fi
          node scripts/release-notes.mjs CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes-file release-notes.md
          else
            gh release create "${{ github.ref_name }}" --generate-notes
          fi
