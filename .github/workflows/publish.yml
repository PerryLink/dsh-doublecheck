name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # The packageManager field in package.json pins the exact pnpm version.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # npm publish runs prepublishOnly (tsc + full test suite) automatically.
      # Requires the NPM_TOKEN repository secret. A tag push without the
      # secret, or for a version already on the registry, no longer skips
      # silently: a release that published nothing used to go green, and it now
      # fails loudly instead. A version already on the registry still skips
      # (idempotent re-runs). (The guard lives in bash because
      # GitHub rejects the secrets context in step-level `if` expressions.)
      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set; refusing to report a release that published nothing"
            exit 1
          fi
          if npm view "dsh-doublecheck@${version}" version >/dev/null 2>&1; then
            echo "dsh-doublecheck@${version} is already published; skipping npm publish"
          else
            npm publish --provenance
          fi

      - name: Verify the version is live on the registry
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          for attempt in 1 2 3 4 5 6; do
            if npm view "dsh-doublecheck@${version}" version >/dev/null 2>&1; then
              echo "dsh-doublecheck@${version} is live on the registry"
              exit 0
            fi
            echo "attempt ${attempt}: not visible on the registry yet; retrying"
            sleep 5
          done
          echo "::error::dsh-doublecheck@${version} is not on the registry after the publish step"
          exit 1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "release ${{ github.ref_name }} already exists; skipping"
            exit 0
          fi
          node scripts/release-notes.mjs CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes-file release-notes.md
          else
            gh release create "${{ github.ref_name }}" --generate-notes
          fi
