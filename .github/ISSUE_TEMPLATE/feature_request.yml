name: Feature request / 功能建议
description: 提出一个新功能或改进建议（Suggest a new feature or improvement）
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出建议！先说清楚「想解决什么问题」，再描述你期望的形态。
        Welcome! Start with the problem you want to solve, then describe the shape you expect.
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / Problem to solve
      description: 现在的痛点是什么？谁在什么场景下会用到？（一两句话即可）
      placeholder: 例如：在 fork 会话中无法区分当前纪律门禁是否对本分支生效……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为 / Expected behavior
      description: 你期望插件提供什么能力或行为？尽量具体（新工具/新门禁/新命令/配置项……）
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives considered（选填）
      description: 你考虑过或已经试过的替代做法，以及它们为什么不理想
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 附加背景 / Additional context（选填）
      description: 链接、截图、示例会话、相关讨论等
    validations:
      required: false
